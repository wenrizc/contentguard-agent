[project]
name = "contentguard-agent"
version = "0.1.0"
description = "Evidence-driven ReAct agent for content review and schedule drafts"
requires-python = ">=3.12"
dependencies = [
  "openai>=1.40,<2",
  "pydantic>=2,<3",
  "python-dotenv>=1,<2",
]

[dependency-groups]
dev = [
  "pytest>=8,<9",
]

[tool.uv]
index-url = "https://pypi.tuna.tsinghua.edu.cn/simple"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
